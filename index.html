<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Favorite Sansoni ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, serif;
  background: linear-gradient(135deg, #ffb6c8, #f7d6e0, #ffc4d6);
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
  color: #8b2347;
}

.card {
  background: rgba(255,255,255,0.85);
  padding: 35px 22px;
  border-radius: 25px;
  width: 88%;
  max-width: 420px;
  box-shadow: 0 10px 40px #b84c7550;
  z-index: 2;
}

h1 {
  font-size: 32px;
}

p {
  font-size: 19px;
  line-height: 1.8;
}

.heart {
  font-size: 65px;
  animation: beat 1s infinite;
}

button {
  background: #e94e83;
  color: white;
  border: none;
  padding: 15px 25px;
  border-radius: 30px;
  font-size: 17px;
  cursor: pointer;
  margin-top: 15px;
}

#message {
  display: none;
  margin-top: 20px;
  animation: appear 1s;
}

.floating {
  position: absolute;
  bottom: -30px;
  animation: float 7s linear infinite;
  font-size: 25px;
}

@keyframes beat {
  50% { transform: scale(1.2); }
}

@keyframes float {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}

@keyframes appear {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="card">

  <div class="heart">❤️</div>

  <h1>My Favorite Sansoni</h1>

  <p>
    You are my favorite person,
    my sweetest thought,
    and my beautiful little world. 💗
  </p>

  <p>
    If I could choose again,
    I would always choose you. ❤️
  </p>

  <button onclick="showLove()">
    Open Your Surprise 💌
  </button>

  <div id="message">
    <h2>I Love You! 💖</h2>
    <p>
      No matter what happens,
      you will always have
      a special place in my heart.
      <br>
      Forever & Always ♾️
    </p>
  </div>

</div>

<script>
function showLove() {
  document.getElementById("message").style.display = "block";
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "floating";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (4 + Math.random() * 4) + "s";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
